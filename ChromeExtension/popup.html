<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>ROF - Fichiers convertis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      width: 420px;
      min-height: 200px;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    header h1 { font-size: 15px; flex: 1; }

    .header-actions { display: flex; gap: 6px; align-items: center; }

    #btn-refresh {
      background: white;
      color: #1a73e8;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    #btn-refresh:hover { background: #e8f0fe; }

    #btn-process-all {
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    #btn-process-all:hover { background: #0a3880; }
    #btn-process-all:disabled { background: #555; cursor: not-allowed; }

    #btn-pause {
      background: #f9a825;
      color: #222;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      display: none;
    }

    #btn-pause:hover { background: #f57f17; }

    #status {
      padding: 8px 16px;
      font-size: 12px;
      color: #555;
      min-height: 28px;
    }

    #file-list { padding: 0 12px 12px; }

    .file-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }

    .file-header:hover { background: #f0f4ff; }

    .file-name {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    .file-actions { display: flex; gap: 8px; align-items: center; }

    .btn-submit {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-submit:hover { background: #1b5e20; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

    .btn-retry {
      background: #e65100;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-retry:hover { background: #bf360c; }
    .btn-retry:disabled { background: #aaa; cursor: not-allowed; }

    .btn-toggle {
      background: none;
      border: 1px solid #aaa;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 12px;
      color: #555;
    }

    .item-error {
      border-left: 3px solid #d93025;
    }

    .item-error-msg {
      font-size: 11px;
      color: #d93025;
      padding: 4px 12px 6px;
    }

    .file-content {
      display: none;
      padding: 10px 12px;
      border-top: 1px solid #eee;
      background: #fafafa;
      max-height: 260px;
      overflow-y: auto;
    }

    .file-content.open { display: block; }

    .record {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
      background: white;
      font-size: 12px;
    }

    .record:last-child { margin-bottom: 0; }

    .record-field { margin-bottom: 2px; }
    .record-field span:first-child { color: #888; margin-right: 4px; }

    #empty-msg {
      text-align: center;
      padding: 32px 16px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ROF — Fichiers convertis</h1>
    <div class="header-actions">
      <button id="btn-process-all">▶ Tout traiter</button>
      <button id="btn-pause">⏸ Pause</button>
      <button id="btn-refresh">⟳ Actualiser</button>
    </div>
  </header>

  <div id="status">Chargement...</div>
  <div id="file-list"></div>

  <script src="popup.js"></script>
</body>
</html>
